name: E2E Testing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (leave empty for latest)'
        required: false
        type: string
  workflow_run:
    workflows: ["Release Webapp"]
    types:
      - completed

concurrency:
  group: e2e-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-latest-release:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            TAG=$(gh release list --repo MuriloSchaefer/klippel --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "No releases found"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Testing release: $TAG"

  test-installation:
    needs: get-latest-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            artifact-pattern: 'ubuntu-latest.zip'
            tests-pattern: 'klippel-tests-ubuntu-latest.zip'
          - os: macos-latest
            runner: macos-latest
            artifact-pattern: 'macos-latest.zip'
            tests-pattern: 'klippel-tests-macos-latest.zip'
          - os: windows-latest
            runner: windows-2022
            artifact-pattern: 'windows-latest.zip'
            tests-pattern: 'klippel-tests-windows-latest.zip'

    steps:
      - name: Disable Defender scanning on workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableArchiveScanning $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Klippel" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\SquirrelTemp" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\npm-cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "Klippel.exe","Setup.exe","Update.exe","node.exe","npm.exe" -ErrorAction SilentlyContinue

      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          echo "Downloading artifacts for pattern: ${{ matrix.artifact-pattern }}"

          gh release download ${{ needs.get-latest-release.outputs.tag }} \
            --repo MuriloSchaefer/klippel \
            --pattern "${{ matrix.artifact-pattern }}" \
            --dir release-artifacts \
            2>&1 || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 1 ]; then
                echo "Warning: No files matched pattern '${{ matrix.artifact-pattern }}'"
                echo "Available assets in release:"
                gh release view ${{ needs.get-latest-release.outputs.tag }} \
                  --repo MuriloSchaefer/klippel \
                  --json assets --jq '.assets[].name' || true
              else
                exit $EXIT_CODE
              fi
            }

          echo "Downloaded artifacts:"
          ls -la release-artifacts/ || echo "No artifacts directory found"

      - name: Verify installer exists
        id: find-installer
        shell: bash
        run: |
          echo "Looking for artifacts matching pattern: ${{ matrix.artifact-pattern }}"

          ZIP_FILE=$(find release-artifacts -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "⚠ No ZIP file found in release artifacts"
            exit 0
          fi

          echo "Found ZIP file: $ZIP_FILE"

          mkdir -p extracted-artifacts
          unzip -o "$ZIP_FILE" -d extracted-artifacts

          echo "Contents of extracted artifacts:"
          find extracted-artifacts -type f | head -20

          if [ "${{ runner.os }}" == "Linux" ]; then
            # Prefer .deb on Ubuntu — RPM-on-Debian fails dependency resolution.
            INSTALLER=$(find extracted-artifacts -type f -name "*.deb" | head -1)
            if [ -z "$INSTALLER" ]; then
              INSTALLER=$(find extracted-artifacts -type f -name "*.rpm" | head -1)
            fi
            if [ -n "$INSTALLER" ]; then
              echo "Found file: $INSTALLER (Type: $(file "$INSTALLER" 2>/dev/null || echo 'unknown'))"
            fi
          elif [ "${{ runner.os }}" == "macOS" ]; then
            INSTALLER=$(find extracted-artifacts -type f \( -name "Klippel*.zip" -o -name "*darwin*.zip" \) | head -1)
            if [ -z "$INSTALLER" ]; then
              INSTALLER=$(find extracted-artifacts -type f -name "*.zip" | head -1)
            fi
          elif [ "${{ runner.os }}" == "Windows" ]; then
            INSTALLER=$(find extracted-artifacts -type f -name "*Setup.exe" | head -1)
            if [ -z "$INSTALLER" ]; then
              INSTALLER=$(find extracted-artifacts -type f -name "*.exe" | head -1)
            fi
          fi

          if [ -z "$INSTALLER" ]; then
            echo "⚠ No installer file found after extracting ZIP"
            find extracted-artifacts -type f
            exit 0
          fi

          echo "✓ Found installer: $INSTALLER"
          echo "INSTALLER_PATH=$INSTALLER" >> $GITHUB_ENV
          echo "installer_path=$INSTALLER" >> $GITHUB_OUTPUT

      - name: Test installation (Linux)
        id: install-linux
        if: runner.os == 'Linux' && steps.find-installer.outputs.installer_path != ''
        run: |
          echo "Installing from: $INSTALLER_PATH"

          FILE_TYPE=$(file "$INSTALLER_PATH" 2>/dev/null || echo "")
          echo "File type: $FILE_TYPE"

          if [[ "$INSTALLER_PATH" == *.deb ]] || [[ "$FILE_TYPE" == *"Debian"* ]]; then
            echo "Installing as DEB package..."
            sudo dpkg -i "$INSTALLER_PATH" || true
            sudo apt-get install -f -y
          elif [[ "$INSTALLER_PATH" == *.rpm ]] || [[ "$FILE_TYPE" == *"RPM"* ]]; then
            echo "Installing as RPM package..."
            sudo rpm -i "$INSTALLER_PATH" || true
          else
            echo "Installing as DEB package (file type unclear)..."
            sudo dpkg -i "$INSTALLER_PATH" || true
            sudo apt-get install -f -y
          fi

          BINARY=$(command -v Klippel || command -v klippel || true)
          if [ -z "$BINARY" ] && [ -x /opt/Klippel/Klippel ]; then
            BINARY=/opt/Klippel/Klippel
          fi
          if [ -n "$BINARY" ]; then
            echo "✓ Linux installation verification passed (binary: $BINARY)"
            echo "KLIPPEL_BIN=$BINARY" >> $GITHUB_ENV
          else
            echo "✗ Linux installation verification failed"
            dpkg -l | grep -i klippel || rpm -qa | grep -i klippel || echo "No Klippel package found"
            exit 1
          fi

      - name: Test app launch (Linux)
        id: launch-linux
        if: runner.os == 'Linux' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2

          BINARY="${KLIPPEL_BIN:-$(command -v Klippel || command -v klippel || true)}"
          if [ -z "$BINARY" ]; then
            echo "✗ Klippel binary not found after install"
            exit 1
          fi

          timeout 20 "$BINARY" --no-sandbox > app_output.log 2>&1 &
          APP_PID=$!
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "✓ Linux app launched successfully (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
          else
            echo "✗ Linux app failed to launch"
            cat app_output.log
            exit 1
          fi

          pkill Xvfb || true

      - name: Test installation (macOS)
        id: install-macos
        if: runner.os == 'macOS' && steps.find-installer.outputs.installer_path != ''
        run: |
          unzip -q "$INSTALLER_PATH" -d test-install

          APP_PATH=$(find test-install -maxdepth 4 -type d -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            APP_PATH=$(cd "$APP_PATH" && pwd)
            echo "✓ macOS installation verification passed (app: $APP_PATH)"
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
            ls -la test-install/
          else
            echo "✗ macOS installation verification failed — .app bundle not found"
            ls -la test-install/
            exit 1
          fi

      - name: Test app launch (macOS)
        id: launch-macos
        if: runner.os == 'macOS' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        run: |
          BINARY=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          if [ -z "$BINARY" ]; then
            echo "✗ Could not locate executable inside $APP_PATH"
            exit 1
          fi

          "$BINARY" > app_output.log 2>&1 &
          APP_PID=$!
          sleep 5

          if ps -p $APP_PID > /dev/null || pgrep -f "Klippel" > /dev/null; then
            echo "✓ macOS app launched successfully"
            kill $APP_PID 2>/dev/null || true
            pkill -f "Klippel" || true
          else
            echo "✗ macOS app failed to launch"
            cat app_output.log
            exit 1
          fi

      - name: Test installation (Windows)
        id: install-windows
        if: runner.os == 'Windows' && steps.find-installer.outputs.installer_path != ''
        shell: pwsh
        run: |
          $installer = $env:INSTALLER_PATH
          if (-not (Test-Path $installer)) {
            Write-Output "✗ Installer file not found: $installer"
            exit 1
          }

          $info = Get-Item $installer
          Write-Output "✓ Installer found: $($info.FullName) ($($info.Length) bytes)"

          # Squirrel installers run silently by default and exit immediately;
          # the actual install runs in the background.
          Start-Process -FilePath $installer -Wait

          # Wait for Squirrel to finish creating the install dir.
          $installDir = Join-Path $env:LOCALAPPDATA "Klippel"
          $exePath = Join-Path $installDir "Klippel.exe"
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $exePath)) {
            Start-Sleep -Milliseconds 500
          }

          if (Test-Path $exePath) {
            Write-Output "✓ Windows install verified: $exePath"
            "KLIPPEL_EXE=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output "✗ Windows install verification failed — Klippel.exe not found in $installDir"
            if (Test-Path $installDir) { Get-ChildItem -Recurse $installDir | Select-Object -First 30 }
            exit 1
          }

      - name: Test app launch (Windows)
        id: launch-windows
        if: runner.os == 'Windows' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = $env:KLIPPEL_EXE
          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Output "✗ Klippel.exe path not set or missing"
            exit 1
          }

          $process = Start-Process -FilePath $exe -PassThru -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          if ($process -and -not $process.HasExited) {
            Write-Output "✓ Windows app launched successfully"
            $process | Stop-Process -Force -ErrorAction SilentlyContinue
          } else {
            $running = Get-Process -Name "Klippel" -ErrorAction SilentlyContinue
            if ($running) {
              Write-Output "✓ Windows app detected running"
              $running | Stop-Process -Force -ErrorAction SilentlyContinue
            } else {
              Write-Output "✗ Windows app failed to launch"
              exit 1
            }
          }

      - name: Install Node.js (for MCP tests bundle)
        if: steps.find-installer.outputs.installer_path != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download MCP tests bundle
        id: download-tests
        if: steps.find-installer.outputs.installer_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p tests-artifacts
          echo "Downloading tests bundle: ${{ matrix.tests-pattern }}"
          if gh release download ${{ needs.get-latest-release.outputs.tag }} \
              --repo MuriloSchaefer/klippel \
              --pattern "${{ matrix.tests-pattern }}" \
              --dir tests-artifacts 2>&1; then
            ZIP=$(find tests-artifacts -type f -name "*.zip" | head -1)
            if [ -n "$ZIP" ]; then
              mkdir -p test-bundle
              unzip -q -o "$ZIP" -d test-bundle
              echo "tests_bundle_path=test-bundle" >> $GITHUB_OUTPUT
              echo "✓ Tests bundle ready at test-bundle"
            else
              echo "⚠ No tests bundle zip found after download"
            fi
          else
            echo "⚠ Tests bundle not available for this release"
          fi

      - name: Run MCP tools tests (Linux)
        id: mcp-tests-linux
        if: runner.os == 'Linux' && steps.download-tests.outputs.tests_bundle_path != ''
        timeout-minutes: 15
        run: |
          set -x

          # Clean up anything left over from the launch step.
          pkill -9 -f Klippel 2>/dev/null || true
          pkill -9 -f klippel 2>/dev/null || true
          pkill -9 Xvfb 2>/dev/null || true
          rm -f "$HOME/.config/Klippel/SingletonLock" "$HOME/.config/klippel/SingletonLock" 2>/dev/null || true
          sleep 1

          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          # Klippel reads ~/klippel/envs/$ENV_NAME/workspaces; older builds
          # crash if ENV_NAME is unset or the dir is missing. Pre-create both.
          export ENV_NAME=default
          export BASE_WORKSPACE=empty
          mkdir -p "$HOME/klippel/envs/$ENV_NAME/workspaces/$BASE_WORKSPACE"

          # Launch the installed app ourselves so we control logging.
          # globalSetup will see CDP already up and attach instead of spawning.
          echo "Launching $KLIPPEL_BIN with CDP on :9222 (ENV_NAME=$ENV_NAME)"
          "$KLIPPEL_BIN" --no-sandbox --remote-debugging-port=9222 \
            > /tmp/klippel-mcp.log 2>&1 &
          KLIPPEL_PID=$!
          echo "Klippel PID: $KLIPPEL_PID"


          # Wait up to 120s for CDP to come up with a real renderer page.
          deadline=$((SECONDS + 120))
          ready=0
          while [ $SECONDS -lt $deadline ]; do
            if ! kill -0 $KLIPPEL_PID 2>/dev/null; then
              echo "✗ Klippel exited before CDP came up"
              break
            fi
            LIST=$(curl -fsS http://localhost:9222/json/list 2>/dev/null || echo '')
            # Accept any target whose URL starts with file:// or http://localhost:
            if echo "$LIST" | grep -Eq '"url":[[:space:]]*"(file://|http://localhost)'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ $ready -ne 1 ]; then
            echo "=== /json/list (last seen) ==="
            echo "${LIST:-<empty>}"
            echo "=== /json/version ==="
            curl -fsS http://localhost:9222/json/version || true
            echo
            echo "=== Klippel log ==="
            cat /tmp/klippel-mcp.log || true
            echo "=== Xvfb log ==="
            cat /tmp/xvfb.log || true
            kill -9 $KLIPPEL_PID 2>/dev/null || true
            kill -9 $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ CDP is up with at least one page"

          # Run the bundled jest. globalSetup will probe-and-attach.
          export KLIPPEL_USE_XVFB=0
          unset KLIPPEL_BIN_PATH  # avoid a second spawn attempt
          chmod +x test-bundle/run-tests.sh

          # Launcher requires an arg; it sets KLIPPEL_BIN_PATH but we just
          # unset it post-script-source isn't possible — invoke jest directly.
          cd test-bundle
          if [ ! -d node_modules ]; then
            npm install --no-audit --no-fund --loglevel=error
          fi
          npx jest
          JEST_EXIT=$?
          cd ..

          echo "=== Klippel log (post-jest) ==="
          tail -n 100 /tmp/klippel-mcp.log || true

          kill -9 $KLIPPEL_PID 2>/dev/null || true
          kill -9 $XVFB_PID 2>/dev/null || true

          exit $JEST_EXIT

      - name: Run MCP tools tests (macOS)
        id: mcp-tests-macos
        if: runner.os == 'macOS' && steps.download-tests.outputs.tests_bundle_path != ''
        timeout-minutes: 15
        run: |
          set -x
          pkill -9 -f Klippel 2>/dev/null || true
          sleep 1

          BINARY=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          if [ -z "$BINARY" ]; then
            echo "✗ Could not locate executable inside $APP_PATH"
            exit 1
          fi

          export ENV_NAME=default
          export BASE_WORKSPACE=empty
          mkdir -p "$HOME/klippel/envs/$ENV_NAME/workspaces/$BASE_WORKSPACE"

          echo "Launching $BINARY with CDP on :9222 (ENV_NAME=$ENV_NAME)"
          "$BINARY" --remote-debugging-port=9222 > /tmp/klippel-mcp.log 2>&1 &
          KLIPPEL_PID=$!

          deadline=$((SECONDS + 120))
          ready=0
          while [ $SECONDS -lt $deadline ]; do
            if ! kill -0 $KLIPPEL_PID 2>/dev/null; then
              echo "✗ Klippel exited before CDP came up"
              break
            fi
            LIST=$(curl -fsS http://localhost:9222/json/list 2>/dev/null || echo '')
            if echo "$LIST" | grep -Eq '"url":[[:space:]]*"(file://|http://localhost)'; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ $ready -ne 1 ]; then
            echo "=== /json/list (last seen) ==="
            echo "${LIST:-<empty>}"
            echo "=== /json/version ==="
            curl -fsS http://localhost:9222/json/version || true
            echo
            echo "=== Klippel log ==="
            cat /tmp/klippel-mcp.log || true
            kill -9 $KLIPPEL_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ CDP is up with at least one page"

          cd test-bundle
          if [ ! -d node_modules ]; then
            npm install --no-audit --no-fund --loglevel=error
          fi
          npx jest
          JEST_EXIT=$?
          cd ..

          echo "=== Klippel log (post-jest) ==="
          tail -n 100 /tmp/klippel-mcp.log || true
          kill -9 $KLIPPEL_PID 2>/dev/null || true
          exit $JEST_EXIT

      - name: Run MCP tools tests (Windows)
        id: mcp-tests-windows
        if: runner.os == 'Windows' && steps.download-tests.outputs.tests_bundle_path != ''
        timeout-minutes: 15
        shell: cmd
        run: |
          set ENV_NAME=default
          set BASE_WORKSPACE=empty
          mkdir "%USERPROFILE%\klippel\envs\default\workspaces\empty" 2>nul
          call test-bundle\run-tests.cmd "%KLIPPEL_EXE%"

      - name: Record step results
        if: always()
        shell: bash
        run: |
          mkdir -p status
          OS_KEY="${{ matrix.os }}"
          INSTALL="${{ steps.install-linux.outcome }}${{ steps.install-macos.outcome }}${{ steps.install-windows.outcome }}"
          LAUNCH="${{ steps.launch-linux.outcome }}${{ steps.launch-macos.outcome }}${{ steps.launch-windows.outcome }}"
          MCP="${{ steps.mcp-tests-linux.outcome }}${{ steps.mcp-tests-macos.outcome }}${{ steps.mcp-tests-windows.outcome }}"
          INSTALL=${INSTALL:-skipped}
          LAUNCH=${LAUNCH:-skipped}
          MCP=${MCP:-skipped}
          printf '%s\n%s\n%s\n%s\n' "$OS_KEY" "$INSTALL" "$LAUNCH" "$MCP" > "status/${OS_KEY}.txt"
          cat "status/${OS_KEY}.txt"

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-status-${{ matrix.os }}
          path: status/
          retention-days: 7

      - name: Upload installation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-test-${{ matrix.os }}-${{ needs.get-latest-release.outputs.tag }}
          path: |
            app_output.log
          retention-days: 7
          if-no-files-found: ignore

  test-summary:
    needs: [get-latest-release, test-installation]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download status artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-status-*
          path: status/
          merge-multiple: true

      - name: Test Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.get-latest-release.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fmt() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped|"") echo "⏭️ Skipped" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          # Installation column collapses install + launch outcomes:
          # - both success → success
          # - either failure → failure
          # - both skipped → skipped
          # - mixed (success + skipped) → skipped (incomplete signal)
          combine_install() {
            local a="$1" b="$2"
            if [ "$a" = "failure" ] || [ "$b" = "failure" ]; then echo "failure"; return; fi
            if [ "$a" = "success" ] && [ "$b" = "success" ]; then echo "success"; return; fi
            echo "skipped"
          }

          read_status() {
            local file="status/$1.txt"
            if [ -f "$file" ]; then
              INSTALL=$(sed -n '2p' "$file")
              LAUNCH=$(sed -n '3p' "$file")
              MCP=$(sed -n '4p' "$file")
            else
              INSTALL="skipped"
              LAUNCH="skipped"
              MCP="skipped"
            fi
            INSTALL=${INSTALL:-skipped}
            LAUNCH=${LAUNCH:-skipped}
            MCP=${MCP:-skipped}
          }

          read_status ubuntu-latest;  LINUX_INSTALL=$(fmt "$(combine_install "$INSTALL" "$LAUNCH")"); LINUX_MCP=$(fmt "$MCP")
          read_status macos-latest;   MAC_INSTALL=$(fmt "$(combine_install "$INSTALL" "$LAUNCH")");   MAC_MCP=$(fmt "$MCP")
          read_status windows-latest; WIN_INSTALL=$(fmt "$(combine_install "$INSTALL" "$LAUNCH")");   WIN_MCP=$(fmt "$MCP")

          TESTED_AT=$(date -u '+%Y-%m-%d %H:%M UTC')

          E2E_FILE=$(mktemp)
          printf '\n---\n\n## E2E Test Results\n\n' >> "$E2E_FILE"
          printf 'Tested: %s · [Run details](%s)\n\n' "$TESTED_AT" "$RUN_URL" >> "$E2E_FILE"
          printf '| OS | Installation | MCP tools tests |\n' >> "$E2E_FILE"
          printf '|---|---|---|\n' >> "$E2E_FILE"
          printf '| Linux | %s | %s |\n'   "$LINUX_INSTALL" "$LINUX_MCP" >> "$E2E_FILE"
          printf '| macOS | %s | %s |\n'   "$MAC_INSTALL"   "$MAC_MCP"   >> "$E2E_FILE"
          printf '| Windows | %s | %s |\n' "$WIN_INSTALL"   "$WIN_MCP"   >> "$E2E_FILE"
          printf '\nEach OS runs independently — failure in one does not affect others.\n' >> "$E2E_FILE"

          {
            echo "## E2E Testing Summary"
            echo ""
            echo "**Release Tested:** ${TAG}"
            cat "$E2E_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          EXISTING_BODY=$(gh release view "$TAG" \
            --repo MuriloSchaefer/klippel \
            --json body --jq '.body // ""')

          gh release edit "$TAG" \
            --repo MuriloSchaefer/klippel \
            --notes "${EXISTING_BODY}$(cat "$E2E_FILE")"
