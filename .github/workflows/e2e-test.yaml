name: E2E Testing

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (leave empty for latest)'
        required: false
        type: string

concurrency:
  group: e2e-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-latest-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            TAG=$(gh release list --repo MuriloSchaefer/klippel --limit 1 --json tagName --jq '.[0].tagName')
          else
            TAG="${{ inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "No releases found"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Testing release: $TAG"

  test-installation:
    needs: get-latest-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-pattern: 'ubuntu-latest.zip'
          - os: macos-latest
            artifact-pattern: 'macos-latest.zip'
          - os: windows-latest
            artifact-pattern: 'windows-latest.zip'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          echo "Downloading artifacts for pattern: ${{ matrix.artifact-pattern }}"

          gh release download ${{ needs.get-latest-release.outputs.tag }} \
            --repo MuriloSchaefer/klippel \
            --pattern "${{ matrix.artifact-pattern }}" \
            --dir release-artifacts \
            2>&1 || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 1 ]; then
                echo "Warning: No files matched pattern '${{ matrix.artifact-pattern }}'"
                echo "Available assets in release:"
                gh release view ${{ needs.get-latest-release.outputs.tag }} \
                  --repo MuriloSchaefer/klippel \
                  --json assets --jq '.assets[].name' || true
              else
                exit $EXIT_CODE
              fi
            }

          echo "Downloaded artifacts:"
          ls -la release-artifacts/ || echo "No artifacts directory found"

      - name: Verify installer exists
        id: find-installer
        shell: bash
        run: |
          echo "Looking for artifacts matching pattern: ${{ matrix.artifact-pattern }}"

          ZIP_FILE=$(find release-artifacts -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "⚠ No ZIP file found in release artifacts"
            exit 0
          fi

          echo "Found ZIP file: $ZIP_FILE"

          mkdir -p extracted-artifacts
          unzip -q "$ZIP_FILE" -d extracted-artifacts

          echo "Contents of extracted artifacts:"
          find extracted-artifacts -type f | head -20

          if [ "${{ runner.os }}" == "Linux" ]; then
            INSTALLER=$(find extracted-artifacts -type f \( -name "*.deb" -o -name "*.rpm" \) | head -1)
            if [ -n "$INSTALLER" ]; then
              echo "Found file: $INSTALLER (Type: $(file "$INSTALLER" 2>/dev/null || echo 'unknown'))"
            fi
          elif [ "${{ runner.os }}" == "macOS" ]; then
            INSTALLER=$(find extracted-artifacts -type f \( -name "Klippel*.zip" -o -name "*darwin*.zip" \) | head -1)
            if [ -z "$INSTALLER" ]; then
              INSTALLER=$(find extracted-artifacts -type f -name "*.zip" | head -1)
            fi
          elif [ "${{ runner.os }}" == "Windows" ]; then
            INSTALLER=$(find extracted-artifacts -type f -name "*.exe" | head -1)
          fi

          if [ -z "$INSTALLER" ]; then
            echo "⚠ No installer file found after extracting ZIP"
            find extracted-artifacts -type f
            exit 0
          fi

          echo "✓ Found installer: $INSTALLER"
          echo "INSTALLER_PATH=$INSTALLER" >> $GITHUB_ENV
          echo "installer_path=$INSTALLER" >> $GITHUB_OUTPUT

      - name: Test installation (Linux)
        if: runner.os == 'Linux' && steps.find-installer.outputs.installer_path != ''
        run: |
          echo "Installing from: $INSTALLER_PATH"

          FILE_TYPE=$(file "$INSTALLER_PATH" 2>/dev/null || echo "")
          echo "File type: $FILE_TYPE"

          if [[ "$INSTALLER_PATH" == *.deb ]] || [[ "$FILE_TYPE" == *"Debian"* ]]; then
            echo "Installing as DEB package..."
            sudo dpkg -i "$INSTALLER_PATH" || true
            sudo apt-get install -f -y
          elif [[ "$INSTALLER_PATH" == *.rpm ]] || [[ "$FILE_TYPE" == *"RPM"* ]]; then
            echo "Installing as RPM package..."
            sudo rpm -i "$INSTALLER_PATH" || true
          else
            echo "Installing as DEB package (file type unclear)..."
            sudo dpkg -i "$INSTALLER_PATH" || true
            sudo apt-get install -f -y
          fi

          if which klippel > /dev/null 2>&1 || which Klippel > /dev/null 2>&1; then
            echo "✓ Linux installation verification passed"
          else
            echo "✗ Linux installation verification failed"
            dpkg -l | grep -i klippel || rpm -qa | grep -i klippel || echo "No Klippel package found"
            exit 1
          fi

      - name: Test app launch (Linux)
        if: runner.os == 'Linux' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 2

          BINARY=$(which klippel 2>/dev/null || which Klippel 2>/dev/null || echo "")
          if [ -z "$BINARY" ]; then
            echo "✗ Klippel binary not found in PATH after install"
            exit 1
          fi

          timeout 20 "$BINARY" --no-sandbox > app_output.log 2>&1 &
          APP_PID=$!
          sleep 5

          if ps -p $APP_PID > /dev/null; then
            echo "✓ Linux app launched successfully (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
          else
            echo "✗ Linux app failed to launch"
            cat app_output.log
            exit 1
          fi

          pkill Xvfb || true

      - name: Test installation (macOS)
        if: runner.os == 'macOS' && steps.find-installer.outputs.installer_path != ''
        run: |
          unzip -q "$INSTALLER_PATH" -d test-install

          if [ -d "test-install/Klippel.app" ]; then
            echo "✓ macOS installation verification passed"
            ls -la test-install/
          else
            echo "✗ macOS installation verification failed — Klippel.app not found"
            ls -la test-install/
            exit 1
          fi

      - name: Test app launch (macOS)
        if: runner.os == 'macOS' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        run: |
          open test-install/Klippel.app --args --no-sandbox > app_output.log 2>&1 &
          sleep 5

          if pgrep -f "Klippel" > /dev/null; then
            echo "✓ macOS app launched successfully"
            pkill -f "Klippel" || true
          else
            echo "✗ macOS app failed to launch"
            cat app_output.log
            exit 1
          fi

      - name: Test installation (Windows)
        if: runner.os == 'Windows' && steps.find-installer.outputs.installer_path != ''
        shell: pwsh
        run: |
          $installer = $env:INSTALLER_PATH
          if (Test-Path $installer) {
            $info = Get-Item $installer
            Write-Output "✓ Installer found: $($info.FullName) ($($info.Length) bytes)"

            & $installer /S 2>&1
            if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq $null) {
              Write-Output "✓ Windows silent install completed"
            } else {
              Write-Output "✗ Windows installation failed (exit code: $LASTEXITCODE)"
              exit 1
            }
          } else {
            Write-Output "✗ Installer file not found: $installer"
            exit 1
          }

      - name: Test app launch (Windows)
        if: runner.os == 'Windows' && steps.find-installer.outputs.installer_path != ''
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "Klippel" `
            -ArgumentList "--no-sandbox" `
            -PassThru `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          if ($process -and -not $process.HasExited) {
            Write-Output "✓ Windows app launched successfully"
            $process | Stop-Process -Force -ErrorAction SilentlyContinue
          } else {
            $running = Get-Process -Name "Klippel" -ErrorAction SilentlyContinue
            if ($running) {
              Write-Output "✓ Windows app detected running"
              $running | Stop-Process -Force -ErrorAction SilentlyContinue
            } else {
              Write-Output "✗ Windows app failed to launch"
              exit 1
            }
          }

      - name: Upload installation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-test-${{ matrix.os }}-${{ needs.get-latest-release.outputs.tag }}
          path: |
            release-artifacts/
            test-install/
            app_output.log
          retention-days: 7

  test-summary:
    needs: [get-latest-release, test-installation]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Test Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.get-latest-release.outputs.tag }}
          MATRIX_RESULT: ${{ needs.test-installation.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MATRIX_RESULT" == "success" ]; then
            LINUX="✅ Passed"
            MACOS="✅ Passed"
            WINDOWS="✅ Passed"
          else
            LINUX="⚠️ Check logs"
            MACOS="⚠️ Check logs"
            WINDOWS="⚠️ Check logs"
          fi

          TESTED_AT=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Build e2e section into a temp file to avoid embedding
          # YAML-special characters (--- and |) in the workflow source.
          E2E_FILE=$(mktemp)
          printf '\n---\n\n## E2E Test Results\n\n' >> "$E2E_FILE"
          printf 'Tested: %s · [Run details](%s)\n\n' "$TESTED_AT" "$RUN_URL" >> "$E2E_FILE"
          printf '| OS | Installation |\n' >> "$E2E_FILE"
          printf '|---|---|\n' >> "$E2E_FILE"
          printf '| Linux | %s |\n' "$LINUX" >> "$E2E_FILE"
          printf '| macOS | %s |\n' "$MACOS" >> "$E2E_FILE"
          printf '| Windows | %s |\n' "$WINDOWS" >> "$E2E_FILE"
          printf '\nEach OS runs independently — failure in one does not affect others.\n' >> "$E2E_FILE"

          # Write workflow step summary
          {
            echo "## E2E Testing Summary"
            echo ""
            echo "**Release Tested:** ${TAG}"
            cat "$E2E_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fetch existing release body and append e2e section
          EXISTING_BODY=$(gh release view "$TAG" \
            --repo MuriloSchaefer/klippel \
            --json body --jq '.body // ""')

          gh release edit "$TAG" \
            --repo MuriloSchaefer/klippel \
            --notes "${EXISTING_BODY}$(cat "$E2E_FILE")"
