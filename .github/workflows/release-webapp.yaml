name: Release Webapp
on:
  workflow_dispatch:

concurrency:
  group: release-webapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-2022

    steps:
      - name: Disable Defender scanning on workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\npm-cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "node.exe","npm.exe","7z.exe" -ErrorAction SilentlyContinue

      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error
        working-directory: webapp
        env:
          npm_config_fund: "false"
          npm_config_audit: "false"

      - name: Build and Make
        run: npm run make
        working-directory: webapp

      - name: List installer artifacts
        if: runner.os != 'Windows'
        run: find webapp/out/make -type f | sort

      - name: List installer artifacts (windows)
        if: runner.os == 'Windows'
        run: Get-ChildItem -Recurse webapp/out/make

      - name: Zip installers
        if: runner.os != 'Windows'
        run: zip -q -j webapp/${{matrix.os}}.zip $(find webapp/out/make -type f)

      - name: Zip installers (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 7z a -tzip -mx=3 webapp/${{matrix.os}}.zip ./webapp/out/make/*

      - name: Archive installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}.zip
          path: webapp/${{matrix.os}}.zip
    
  release:
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: webapp

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: webapp/dist/

      - name: Semantic release
        run: npx semantic-release --debug
        working-directory: webapp
        env:
          GITHUB_TOKEN: ${{secrets.DEPLOY_KEY}}