name: Release Webapp
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: webapp

      - name: Build and Make
        run: npm run make
        working-directory: webapp

      - name: List installer artifacts
        if: matrix.os != 'windows-latest'
        run: find webapp/out/make -type f | sort

      - name: List installer artifacts (windows)
        if: matrix.os == 'windows-latest'
        run: Get-ChildItem -Recurse webapp/out/make

      - name: Zip installers
        if: matrix.os != 'windows-latest'
        run: zip -q -j webapp/${{matrix.os}}.zip $(find webapp/out/make -type f)

      - name: Zip installers (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $files = Get-ChildItem -Recurse -File webapp/out/make | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $files -Destination webapp/${{matrix.os}}.zip

      - name: Archive installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.os}}.zip
          path: webapp/${{matrix.os}}.zip
    
  release:
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: webapp

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: webapp/dist/

      - name: Semantic release
        run: npx semantic-release --debug
        working-directory: webapp
        env:
          GITHUB_TOKEN: ${{secrets.DEPLOY_KEY}}